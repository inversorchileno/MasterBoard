name: Windows build

on:
  push:
    branches: [ master ]
    # Documentation alone does not make a new version.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Compiled into Master Board, which compares it with the latest release to offer updates.
  LIBERTYBOARD_BUILD: ${{ github.run_number }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout Master Board
        uses: actions/checkout@v4
        with:
          path: MasterBoard

      - name: Checkout OpenBoard third-party libraries
        uses: actions/checkout@v4
        with:
          repository: OpenBoard-org/OpenBoard-ThirdParty
          path: OpenBoard-ThirdParty

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebengine qtwebchannel qtpositioning qt5compat qtimageformats qtspeech'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build QuaZip
        shell: cmd
        working-directory: OpenBoard-ThirdParty/quazip
        run: |
          qmake quazip.pro -spec win32-msvc "CONFIG+=release" "QT+=core5compat" || exit /b 1
          nmake release || exit /b 1
          if not exist lib\win32\release\quazip.lib exit /b 1

      - name: Build
        shell: cmd
        working-directory: MasterBoard
        run: |
          rem The translations first: qmake lists the .qm files to install when it runs.
          lrelease OpenBoard.pro || exit /b 1
          qmake OpenBoard.pro -spec win32-msvc "CONFIG+=release" || exit /b 1
          nmake release-install || exit /b 1
          if not exist build\win32\release\product\MasterBoard.exe exit /b 1
          if not exist build\win32\release\product\i18n\OpenBoard_es.qm exit /b 1

      - name: Collect runtime files
        shell: cmd
        working-directory: MasterBoard
        run: |
          set PRODUCT=build\win32\release\product
          windeployqt --release --compiler-runtime --no-system-d3d-compiler %PRODUCT%\MasterBoard.exe || exit /b 1
          rem The name of before, for the shortcuts and for the update of the versions called LibertyBoard,
          rem which open LibertyBoard.exe again after copying the new files.
          copy /y %PRODUCT%\MasterBoard.exe %PRODUCT%\LibertyBoard.exe || exit /b 1
          xcopy /y /q ..\OpenBoard-ThirdParty\poppler\bin\*.dll %PRODUCT%\ || exit /b 1
          xcopy /y /q ..\OpenBoard-ThirdParty\openssl\openssl-3.0.15-win64\bin\*.dll %PRODUCT%\ || exit /b 1
          xcopy /y /q ..\OpenBoard-ThirdParty\zlib\1.2.11\bin\zlib.dll %PRODUCT%\ || exit /b 1
          rem Master Board uses the C API of poppler only, and poppler-cpp needs a library that is not shipped.
          del %PRODUCT%\poppler-cpp.dll || exit /b 1
          xcopy /y /q /s /i resources\customizations %PRODUCT%\customizations || exit /b 1
          xcopy /y /q /s /i resources\startupHints %PRODUCT%\startupHints || exit /b 1
          rem Qt's own dialogs, like the color dialog, in the language of the user
          xcopy /y /q "%QT_ROOT_DIR%\translations\qt_*.qm" %PRODUCT%\i18n\ || exit /b 1
          xcopy /y /q "%QT_ROOT_DIR%\translations\qtbase_*.qm" %PRODUCT%\i18n\ || exit /b 1

      - name: Add the C++ runtime
        shell: pwsh
        working-directory: MasterBoard
        run: |
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "C++ runtime not found" }
          Copy-Item "$($crt.FullName)\*.dll" "build\win32\release\product\"

      - name: Check that every DLL is shipped
        shell: pwsh
        working-directory: MasterBoard/build/win32/release/product
        run: |
          $shipped = @{}
          Get-ChildItem -Recurse -File -Include *.dll,*.exe | ForEach-Object { $shipped[$_.Name.ToLower()] = $true }
          $missing = @()
          Get-ChildItem -File -Include *.dll,*.exe -Path .\* | ForEach-Object {
            $binary = $_.Name
            dumpbin /dependents $_.FullName | Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object {
              $dll = $_.Matches[0].Groups[1].Value.ToLower()
              $isSystem = (Test-Path "$env:SystemRoot\System32\$dll") -or $dll.StartsWith('api-ms-') -or $dll.StartsWith('ext-ms-')
              if (-not $shipped.ContainsKey($dll) -and -not $isSystem) { $missing += "$binary needs $dll" }
            }
          }
          if ($missing.Count -gt 0) { $missing | Sort-Object -Unique | Write-Output; throw "Missing DLLs" }
          Write-Output "All DLLs are shipped."

      - name: Upload Master Board
        uses: actions/upload-artifact@v4
        with:
          name: MasterBoard-windows
          path: MasterBoard/build/win32/release/product
          retention-days: 30

      - name: Publish the release used by the update menu
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        working-directory: MasterBoard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "MasterBoard-windows.zip"
          Compress-Archive -Path "build\win32\release\product\*" -DestinationPath $zip -Force
          $tag = "build-$env:LIBERTYBOARD_BUILD"
          # The version shown: the major version and the number of the build, as V2.31.
          $major = ((Get-Content version.txt | Select-String 'VERSION_MAJ\s*=\s*(\d+)').Matches[0].Groups[1].Value)
          $title = "Master Board V$major.$env:LIBERTYBOARD_BUILD"
          # The notes of this build, written in docs/releases, else a short text.
          $notes = "docs\releases\$tag.md"
          if (Test-Path $notes) {
            gh release create $tag $zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $title --notes-file $notes --latest
          } else {
            gh release create $tag $zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $title --notes "$title. Unzip and open MasterBoard.exe, or use About > Update in Master Board." --latest
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # The notes of the earlier builds follow their files, when they change.
          Get-ChildItem "docs\releases\build-*.md" | Where-Object { $_.BaseName -ne $tag } | ForEach-Object {
            $number = $_.BaseName -replace 'build-', ''
            # Up to build 30 the program was version 1, from build 31 version 2.
            $old = if ([int]$number -ge 31) { $major } else { 1 }
            gh release edit $_.BaseName --repo "${{ github.repository }}" --title "Master Board V$old.$number" --notes-file $_.FullName 2>$null
          }
          exit 0
