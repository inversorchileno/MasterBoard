name: Linux and macOS builds

on:
  push:
    branches: [ master, 'claude/**' ]
    # Documentation alone does not make a new version.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Master Board
        uses: actions/checkout@v4

      - name: Number of the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same number as the Windows build of this commit, for About > Update.
          number=$(gh api "repos/${{ github.repository }}/actions/workflows/windows-build.yml/runs?head_sha=${{ github.sha }}" --jq '.workflow_runs[0].run_number // empty' || true)
          echo "LIBERTYBOARD_BUILD=${number}" >> "$GITHUB_ENV"
          echo "Build number: ${number:-none}"

      - name: Install the libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config file patchelf libfuse2 xvfb imagemagick \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-5compat-dev \
            qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools qt6-webengine-dev qt6-webengine-dev-tools \
            qt6-webchannel-dev qt6-speech-dev qt6-speech-speechd-plugin qt6-pdf-dev \
            qt6-positioning-dev qt6-image-formats-plugins qt6-qpa-plugins qt6-wayland \
            libqt6svgwidgets6 libqt6opengl6-dev \
            libpoppler-dev libpoppler-cpp-dev libpoppler-private-dev libquazip1-qt6-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libssl-dev zlib1g-dev libx11-dev libgl-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_VERSION=6 \
            -DCMAKE_INSTALL_PREFIX=/usr -DLIBERTYBOARD_RELOCATABLE=ON
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Make the AppImage
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
          APPIMAGE_EXTRACT_AND_RUN: 1
          OUTPUT: MasterBoard-linux-x86_64.AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          rm -f AppDir/usr/share/applications/*.desktop
          # linuxdeploy takes icons up to 512 x 512.
          convert docs/images/masterboard-logo.png -resize 512x512 masterboard.png
          cat > masterboard.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Master Board
          Comment=Whiteboard and PDF reader
          Exec=openboard %F
          Icon=masterboard
          Categories=Education;Office;
          MimeType=application/pdf;
          EOF
          sed -i 's/^ *//' masterboard.desktop
          export EXTRA_QT_MODULES="texttospeech;svg;webenginecore;multimedia"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/openboard \
            -d masterboard.desktop -i masterboard.png --plugin qt --output appimage
          ls -la *.AppImage

      - name: Start it once
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          # It must still be running after 25 seconds: it opened without crashing.
          set +e
          HOME="$RUNNER_TEMP/home" xvfb-run -a timeout 25 ./MasterBoard-linux-x86_64.AppImage
          code=$?
          echo "exit code: $code"
          test "$code" = "124"

      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MasterBoard-linux
          path: MasterBoard-linux-x86_64.AppImage
          retention-days: 30

      - name: Add it to the release of this build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/attach-to-release.sh MasterBoard-linux-x86_64.AppImage

  macos:
    # The new Macs with an Apple chip (M1, M2...), and the older ones with Intel.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew gives ready Qt and libraries for Apple chips.
          - runner: macos-15
            name: apple-silicon
            qt: brew
          # It no longer does for Intel: the official Qt, and the rest by conda-forge.
          - runner: macos-15-intel
            name: intel
            qt: official
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150

    steps:
      - name: Checkout Master Board
        uses: actions/checkout@v4

      - name: Number of the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api "repos/${{ github.repository }}/actions/workflows/windows-build.yml/runs?head_sha=${{ github.sha }}" --jq '.workflow_runs[0].run_number // empty' || true)
          echo "LIBERTYBOARD_BUILD=${number}" >> "$GITHUB_ENV"
          echo "Build number: ${number:-none}"

      - name: Install the libraries (Homebrew)
        timeout-minutes: 45
        if: matrix.qt == 'brew'
        run: |
          brew update >/dev/null
          brew install qt ffmpeg pkgconf ninja openssl@3 freetype fontconfig jpeg-turbo libpng openjpeg little-cms2 || true
          brew list --versions qt ffmpeg
          echo "QT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"
          echo "DEPS=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install the libraries (official Qt)
        timeout-minutes: 45
        if: matrix.qt == 'official'
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt mac desktop 6.8.3 clang_64 -O "$HOME/Qt" \
            -m qtwebengine qtwebchannel qtpositioning qtmultimedia qtspeech qt5compat qtimageformats qtpdf
          qt="$HOME/Qt/6.8.3/macos"
          # Homebrew builds everything from source on Intel Macs: conda-forge has it ready.
          curl -sSL https://micro.mamba.pm/api/micromamba/osx-64/latest | tar -xj -C "$HOME" bin/micromamba
          "$HOME/bin/micromamba" create -y -p "$HOME/deps" -c conda-forge \
            ffmpeg freetype fontconfig libjpeg-turbo libpng openjpeg lcms2 zlib pkg-config ninja
          echo "$HOME/deps/bin" >> "$GITHUB_PATH"
          echo "QT_DIR=$qt" >> "$GITHUB_ENV"
          echo "DEPS=$HOME/deps" >> "$GITHUB_ENV"

      - name: Build QuaZip
        run: |
          # Built here: the one of Homebrew points to the libbz2 of another SDK.
          qt="$QT_DIR"
          git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git "$RUNNER_TEMP/quazip"
          cmake -S "$RUNNER_TEMP/quazip" -B "$RUNNER_TEMP/quazip-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQUAZIP_QT_MAJOR_VERSION=6 -DQUAZIP_BZIP2=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_INSTALL_PREFIX="$HOME/quazip"
          cmake --build "$RUNNER_TEMP/quazip-build"
          cmake --install "$RUNNER_TEMP/quazip-build"

      - name: Build poppler
        timeout-minutes: 45
        run: |
          # The version of Linux: the one of Homebrew has another interface.
          curl -sSL -o "$RUNNER_TEMP/poppler.tar.xz" https://poppler.freedesktop.org/poppler-24.02.0.tar.xz
          tar xf "$RUNNER_TEMP/poppler.tar.xz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/poppler-24.02.0" -B "$RUNNER_TEMP/poppler-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/poppler" -DCMAKE_INSTALL_NAME_DIR="$HOME/poppler/lib" \
            -DCMAKE_PREFIX_PATH="$DEPS" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DENABLE_UNSTABLE_API_ABI_HEADERS=ON -DENABLE_CPP=ON -DENABLE_QT5=OFF -DENABLE_QT6=OFF \
            -DENABLE_GLIB=OFF -DENABLE_GOBJECT_INTROSPECTION=OFF -DENABLE_UTILS=OFF -DENABLE_BOOST=OFF \
            -DENABLE_NSS3=OFF -DENABLE_GPGME=OFF -DENABLE_LIBCURL=OFF -DENABLE_LIBTIFF=OFF \
            -DBUILD_GTK_TESTS=OFF -DBUILD_QT5_TESTS=OFF -DBUILD_QT6_TESTS=OFF -DBUILD_CPP_TESTS=OFF \
            -DBUILD_MANUAL_TESTS=OFF -DRUN_GPERF_IF_PRESENT=OFF
          cmake --build "$RUNNER_TEMP/poppler-build"
          cmake --install "$RUNNER_TEMP/poppler-build"
          echo "PREFIXES=$QT_DIR;$HOME/quazip;$HOME/poppler;$DEPS" >> "$GITHUB_ENV"
          # Only for what is not found elsewhere: the libiconv of conda-forge must not replace that of macOS.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$HOME/quazip/lib:$HOME/poppler/lib:$DEPS/lib:/usr/local/lib:/usr/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/poppler/lib/pkgconfig:$DEPS/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        run: |
          # The code includes <poppler/Object.h>: the folder above that of poppler.
          export CXXFLAGS="-I$HOME/poppler/include"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_VERSION=6 \
            -DCMAKE_PREFIX_PATH="$PREFIXES" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build

      - name: Make the application and the disk image
        run: |
          app=build/MasterBoard.app
          resources="$app/Contents/Resources"
          mkdir -p "$resources"
          # The data of Master Board, where the macOS version looks for it.
          cp -R resources/etc resources/library resources/startupHints "$resources/"
          cp -R resources/customizations resources/fonts "$resources/" 2>/dev/null || true
          mkdir -p "$resources/i18n"
          cp build/i18n/*.qm "$resources/i18n/" 2>/dev/null || cp build/*.qm "$resources/i18n/" 2>/dev/null || true
          # The icon, from the logo.
          mkdir icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size docs/images/masterboard-logo.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double docs/images/masterboard-logo.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$resources/MasterBoard.icns"
          "$QT_DIR/bin/macdeployqt" "$app" -verbose=1 -libpath="$HOME/quazip/lib" -libpath="$HOME/poppler/lib" -libpath="$DEPS/lib"
          bash .github/workflows/fix-macos-libraries.sh "$app"
          codesign --force --deep --sign - "$app"
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Master Board" -srcfolder dmg -ov -format UDZO MasterBoard-macos-${{ matrix.name }}.dmg
          ls -la MasterBoard-macos-${{ matrix.name }}.dmg

      - name: Check that the application carries its libraries
        run: |
          # No library may be looked for in the folders of this machine.
          bad=$(find build/MasterBoard.app -type f \( -perm -u+x -o -name '*.dylib' \) -exec otool -L {} \; 2>/dev/null \
                | grep -E '^\s+(/Users/|/opt/homebrew|/usr/local)' | sort -u || true)
          if [ -n "$bad" ]; then echo "Libraries outside the application:"; echo "$bad"; exit 1; fi
          echo "All libraries are inside the application."

      - name: Start it once
        run: |
          set +e
          unset DYLD_FALLBACK_LIBRARY_PATH
          build/MasterBoard.app/Contents/MacOS/MasterBoard &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then echo "still running"; kill $pid; exit 0; fi
          wait $pid; echo "exit code: $?"; exit 1

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: MasterBoard-macos-${{ matrix.name }}
          path: MasterBoard-macos-${{ matrix.name }}.dmg
          retention-days: 30

      - name: Add it to the release of this build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/attach-to-release.sh MasterBoard-macos-${{ matrix.name }}.dmg
