<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>スタンプ</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">スタンプ</h1>
<p class="intro">ワンクリックで添削や印付けができます。</p>
<div class="image"><img src="../../assets/guide/stamp.png" alt=""></div>
<ul>
<li><b>スタンプ</b>ボタンですべてのスタンプ(<b>承認、現状のまま、社外秘、下書き…</b>)が開きます。一つ選んでページをクリックします。</li>
<li><b>あなたの PNG</b>:自分の画像をスタンプにできます。署名やロゴなどに。</li>
<li><b>削除</b>:スタンプをクリックすると消えます。</li>
</ul>
<span class="tip">あなたの PNG はプログラムを開くたびに空になります。画像をもう一度選んでください。</span>
</body>
</html>
