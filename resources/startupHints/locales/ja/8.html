<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>選択:矢印 / 投げ縄、そして手のひら</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">選択:矢印 / 投げ縄、そして手のひら</h1>
<p class="intro">ページ上のものを選び、動かし、変更します。</p>
<div class="image"><img src="../../assets/guide/selector.png" alt=""></div>
<ul>
<li><b>矢印</b>:四角形をドラッグして選択します。PDF 上では文字をコピーします。</li>
<li><b>投げ縄</b>:選びたいものを自由な線で囲みます。</li>
<li>選んだものは枠のボタンで移動・拡大・回転・コピー・削除できます。</li>
<li><b>手のひら</b>でページを動かします。<b>ズーム</b>は右下にあります(Ctrl + マウスホイールでも可)。</li>
<li><b>線、図形、矢印</b>を選択すると、下のパネルで<b>色、サイズ、不透明度</b>を変えられます(元に戻すで取り消し)。</li>
</ul>
<span class="tip">検索(右上)で PDF の中の言葉を探せます。</span>
</body>
</html>
