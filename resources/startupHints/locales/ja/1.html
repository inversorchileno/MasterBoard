<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LibertyBoard へようこそ</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">LibertyBoard へようこそ</h1>
<p class="intro">書く、描く、発表する、学ぶためのボードと PDF リーダーです。このガイドでは各ツールを紹介します。右の目次からテーマを選んでください。</p>
<div class="image"><img src="../../assets/guide/board.png" alt=""></div>
<ul>
<li>上には<b>メニュー</b>:ホーム(開く、保存、印刷)、モード(ボード、ダブルボード、デスクトップ)、編集、ツール、カスタマイズ、情報。</li>
<li>その下は<b>オプションバー</b>:選んだツールのオプションを表示します。</li>
<li>右側は<b>ツールパレット</b>、左側は文書の<b>ページ</b>です。</li>
<li>右上:キャンバスをロック、PDF の目次、検索、デスクトップモードへの切り替え。</li>
</ul>
<span class="tip">このガイドはいつでも 情報 → ヒントとコツ(F1)から開けます。</span>
</body>
</html>
