<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ペン</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">ペン</h1>
<p class="intro">マウスやペンタブレットで、自由に書いたり描いたりします。</p>
<div class="image"><img src="../../assets/guide/pen.png" alt=""></div>
<ul>
<li>5 種類のペン先:<b>ボールペン、万年筆、カリグラフィーペン、鉛筆、マーカー</b>。</li>
<li><b>太さ</b>はスライダーか数字で。</li>
<li><b>色</b>:ワンクリックで 15 色、カラーホイールで任意の色、<b>スポイト</b>で画面から色を取得。</li>
<li><b>不透明度</b>で線の透け具合を変えます。</li>
<li><b>図形を認識</b>:手描きの円・四角・線がきれいな図形になります。</li>
<li><b>手書き文字を認識して変換</b>(Windows):書き終えて少しすると、書いた言葉が同じ大きさと色のテキストボックスになります。</li>
</ul>
<span class="tip">選んだ色はパレットのペンのアイコンに表示されます。</span>
</body>
</html>
