<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">选择：箭头 / 套索，以及手形</h1>
<p class="intro">用来选择、移动和修改页面上的内容。</p>
<div class="image"><img src="../../assets/guide/selector.png" alt=""></div>
<ul>
<li><b>箭头</b>：拖出矩形进行选择；在 PDF 上可复制其文字。</li>
<li><b>套索</b>：用自由线条圈住要选的内容。</li>
<li>选中的内容可用边框上的按钮移动、放大、旋转、复制或删除。</li>
<li><b>手形</b>移动页面；<b>缩放</b>在右下角（或 Ctrl + 鼠标滚轮）。</li>
<li>选中<b>笔画、形状或箭头</b>时，下方的面板可更改其<b>颜色、大小和不透明度</b>（撤销可还原）。</li>
</ul>
<span class="tip">搜索（右上角）可在 PDF 中查找文字。</span>
</body>
</html>
