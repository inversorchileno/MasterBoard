<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">AI</h1>
<p class="intro">不离开白板即可使用 ChatGPT、Claude、Gemini、Copilot 等 AI。</p>
<div class="image"><img src="../../assets/guide/ai.png" alt=""></div>
<ul>
<li>功能：<b>摘要、翻译、创建图片、去除背景、生成式擦除和转写</b>。</li>
<li>选择<b>页面的一部分</b>或<b>整个 PDF</b>；Master Board 会附上文件、写好指令并发送。</li>
<li>AI 页面在侧边打开，并保留登录状态；上方的列表可切换 AI。</li>
<li>结果可拖到页面上、右键 → <b>放到页面</b>，或下载后放回。</li>
<li>免费次数用完时，会提示改用其他 AI。AI 列表在<b>首选项 → AI</b>中编辑。</li>
</ul>
<span class="tip">有些功能需要登录 AI，例如创建图片。</span>
</body>
</html>
