<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>印章</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">印章</h1>
<p class="intro">一键批改和标记。</p>
<div class="image"><img src="../../assets/guide/stamp.png" alt=""></div>
<ul>
<li><b>印章</b>按钮会打开所有印章（<b>已批准、照原样、机密、草稿…</b>）：选择一个，然后点击页面。</li>
<li><b>你的 PNG</b>：用你自己的图片作为印章，例如签名或标志。</li>
<li><b>移除</b>：点击印章即可删除。</li>
</ul>
<span class="tip">每次打开程序时“你的 PNG”都是空的：请重新选择图片。</span>
</body>
</html>
