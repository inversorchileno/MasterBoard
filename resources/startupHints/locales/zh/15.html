<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>朗读</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">朗读</h1>
<p class="intro">Master Board 用 Windows 的语音朗读文字。</p>
<div class="image"><img src="../../assets/guide/voice.png" alt=""></div>
<ul>
<li><b>从头开始</b>：朗读本页，然后继续后面的页面。</li>
<li><b>所选文字</b>：在要朗读的文字上拖出矩形，文字会以黄色标出。</li>
<li><b>从点击处开始</b>：从点击的词开始朗读。</li>
<li><b>播放</b>、<b>暂停</b>、<b>停止</b>和<b>下一页</b>。</li>
</ul>
<span class="tip">也可在 编辑 → 朗读和听写 → 朗读（Ctrl + Shift + L）中使用。</span>
</body>
</html>
