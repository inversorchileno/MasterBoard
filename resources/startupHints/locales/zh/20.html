<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测量</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">测量</h1>
<p class="intro">在白板和桌面上测量距离、周长和面积。</p>
<div class="image"><img src="../../assets/guide/measure.png" alt=""></div>
<ul>
<li>第一次使用时，测量窗口会询问<b>单位</b>（毫米、厘米、米、千米、英寸、英尺、码或英里），并要求画一条长度为 1 个该单位的<b>参照线</b>。</li>
<li><b>距离</b>：从一端拖到另一端。</li>
<li><b>周长</b>和<b>面积</b>：在每个角点击，在最后一个角双击；按 Esc 重新开始。</li>
<li>拖动窗口可以移动它；<b>重新开始</b>会重新询问单位和参照，<b>X</b> 结束测量。</li>
</ul>
<span class="tip">换用其他工具时，窗口会保留最后的测量值。在白板上参照跟随页面：缩放不会改变测量值。</span>
</body>
</html>
