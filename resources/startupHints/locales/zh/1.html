<h1 class="title">欢迎使用 Master Board</h1>
<p class="intro">一块白板和一个 PDF 阅读器，用来书写、绘画、演示和学习。本指南介绍每个工具：在右侧目录中选择主题。</p>
<div class="image"><img src="../../assets/guide/board.png" alt=""></div>
<ul>
<li>上方是<b>菜单</b>：主页（打开、保存、打印）、模式（白板、双白板、桌面）、编辑、工具、自定义和关于。</li>
<li>下面是<b>选项栏</b>：显示所选工具的选项。</li>
<li>右侧是<b>工具栏</b>，左侧是文档的<b>页面</b>。</li>
<li>右上角：锁定画布、PDF 目录、搜索以及切换到桌面模式。</li>
</ul>
<span class="tip">随时可在 关于 → 程序指南（F1）中重新打开本指南。</span>
</body>
</html>
