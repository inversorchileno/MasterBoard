<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>笔</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <meta name="viewport" content="width=device-width" />
</head>
<body>
<h1 class="title">笔</h1>
<p class="intro">用鼠标或数位笔自由书写和绘画。</p>
<div class="image"><img src="../../assets/guide/pen.png" alt=""></div>
<ul>
<li>五种笔尖：<b>圆珠笔、钢笔、书法笔、铅笔和马克笔</b>。</li>
<li>用滑块或输入数字设置<b>粗细</b>。</li>
<li><b>颜色</b>：一键选择 15 种颜色，色轮可选任意颜色，<b>吸管</b>可从屏幕取色。</li>
<li><b>不透明度</b>让笔画更透明或更实。</li>
<li><b>识别形状</b>：手绘的圆、矩形或直线会变得规整。</li>
<li><b>识别并转换手写文字</b>（Windows）：停笔片刻后，写下的文字会变成大小和颜色相同的文本框。</li>
</ul>
<span class="tip">所选颜色会显示在工具栏的笔图标上。</span>
</body>
</html>
